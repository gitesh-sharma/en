<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Map — Merahi, Siwan, Bihar (841240)</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; background:#0a0e1a; }
        #map { width:100vw; height:100vh; }

        /* ── Loading ── */
        #loader {
            position:fixed; inset:0; z-index:9999;
            background:linear-gradient(135deg,#0a0e1a 0%,#1a1a4e 100%);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            transition:opacity .8s;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        .spinner { width:56px; height:56px; border:4px solid rgba(255,255,255,.1);
            border-top-color:#60a5fa; border-radius:50%; animation:sp .8s linear infinite; }
        @keyframes sp { to { transform:rotate(360deg); } }
        #loader p { color:#93c5fd; margin-top:18px; letter-spacing:3px; font-size:13px; text-transform:uppercase; }

        /* ── Glass Card Mixin ── */
        .glass {
            background:rgba(10,14,30,.82); backdrop-filter:blur(18px) saturate(1.4);
            border:1px solid rgba(255,255,255,.08); border-radius:16px;
            box-shadow:0 12px 40px rgba(0,0,0,.45);
        }

        /* ── Title ── */
        .title-bar {
            position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:10;
            padding:14px 32px; text-align:center; white-space:nowrap;
        }
        .title-bar h1 { color:#fff; font-size:20px; font-weight:700; }
        .title-bar h1 span { color:#60a5fa; }
        .title-bar .sub { color:#94a3b8; font-size:11px; letter-spacing:3px; margin-top:3px; }
        .badge {
            display:inline-block; margin-top:7px; padding:3px 14px;
            background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:#fff;
            border-radius:20px; font-size:11px; font-weight:700; letter-spacing:1px;
        }

        /* ── Info Panel ── */
        .info { position:absolute; bottom:24px; left:16px; z-index:10; padding:18px 22px; min-width:250px; color:#e2e8f0; }
        .info h3 { color:#60a5fa; font-size:11px; letter-spacing:3px; text-transform:uppercase; margin-bottom:10px; }
        .row { display:flex; justify-content:space-between; padding:6px 0;
            border-bottom:1px solid rgba(255,255,255,.06); font-size:12.5px; }
        .row:last-child { border:none; }
        .lbl { color:#64748b; } .val { font-weight:600; }

        /* ── Buttons ── */
        .btns { position:absolute; bottom:24px; right:16px; z-index:10; display:flex; flex-direction:column; gap:8px; }
        .btn {
            width:44px; height:44px; border:none; border-radius:13px; cursor:pointer;
            font-size:18px; color:#e2e8f0; display:grid; place-items:center;
            background:rgba(10,14,30,.82); backdrop-filter:blur(14px);
            border:1px solid rgba(255,255,255,.08);
            box-shadow:0 6px 20px rgba(0,0,0,.35); transition:.25s;
        }
        .btn:hover { background:rgba(59,130,246,.35); border-color:#3b82f6; transform:scale(1.08); }
        .btn.active { background:linear-gradient(135deg,#3b82f6,#8b5cf6); border-color:transparent; }

        /* ── Style Switcher ── */
        .styles { position:absolute; top:16px; right:16px; z-index:10; display:flex; gap:6px; }
        .sbtn {
            padding:8px 14px; border:none; border-radius:11px; cursor:pointer;
            font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
            color:#94a3b8; background:rgba(10,14,30,.82); backdrop-filter:blur(14px);
            border:1px solid rgba(255,255,255,.08); transition:.25s;
        }
        .sbtn:hover,.sbtn.on { color:#fff; background:linear-gradient(135deg,#3b82f6,#8b5cf6); border-color:transparent; }

        /* ── Coords ── */
        .coords {
            position:absolute; top:16px; left:16px; z-index:10;
            padding:10px 16px; font-family:'Courier New',monospace; font-size:11px; color:#64748b;
        }
        .coords b { color:#60a5fa; }

        /* ── Popup ── */
        .maplibregl-popup-content {
            background:rgba(10,14,30,.95)!important; color:#fff!important;
            border-radius:14px!important; padding:14px 18px!important;
            border:1px solid rgba(255,255,255,.1)!important;
            box-shadow:0 16px 50px rgba(0,0,0,.5)!important; min-width:190px;
        }
        .maplibregl-popup-tip { border-top-color:rgba(10,14,30,.95)!important; }
        .pt { font-size:15px; font-weight:700; }
        .pd { font-size:11.5px; color:#93c5fd; margin-top:4px; line-height:1.5; }

        /* ── Markers ── */
        .mk {
            width:26px; height:26px; border-radius:50%; border:3px solid #fff; cursor:pointer;
            box-shadow:0 3px 12px rgba(0,0,0,.4); transition:.2s; position:relative;
        }
        .mk:hover { transform:scale(1.25); }
        .mk::after { content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
            border-left:5px solid transparent; border-right:5px solid transparent; border-top:7px solid #fff; }
        .mk-c { background:linear-gradient(135deg,#ef4444,#dc2626); animation:pulse 2s infinite; }
        .mk-t { background:linear-gradient(135deg,#f59e0b,#d97706); }
        .mk-s { background:linear-gradient(135deg,#3b82f6,#1d4ed8); }
        .mk-w { background:linear-gradient(135deg,#06b6d4,#0891b2); }
        .mk-r { background:linear-gradient(135deg,#8b5cf6,#7c3aed); }
        .mk-v { background:linear-gradient(135deg,#10b981,#059669); }
        @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)} 50%{box-shadow:0 0 0 14px rgba(239,68,68,0)} }

        @media(max-width:700px){
            .info,.coords{display:none}
            .title-bar h1{font-size:15px}
            .styles{flex-direction:column;top:auto;bottom:80px;right:8px}
        }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p>Loading Merahi…</p></div>

<div class="title-bar glass">
    <h1>📍 <span>Merahi</span>, Siwan, Bihar</h1>
    <div class="sub">REAL 3D VECTOR MAP</div>
    <div class="badge">📮 841240</div>
</div>

<div class="coords glass" id="coords">LAT <b id="cLat">26.1200</b> &nbsp; LNG <b id="cLng">84.3550</b></div>

<div class="styles">
    <button class="sbtn on" data-s="liberty">🏙️ 3D City</button>
    <button class="sbtn" data-s="bright">☀️ Bright</button>
    <button class="sbtn" data-s="positron">🌫️ Light</button>
    <button class="sbtn" data-s="dark">🌙 Dark</button>
</div>

<div class="info glass">
    <h3>📋 Location Info</h3>
    <div class="row"><span class="lbl">Village</span><span class="val">Merahi</span></div>
    <div class="row"><span class="lbl">Block</span><span class="val">Siwan Sadar</span></div>
    <div class="row"><span class="lbl">District</span><span class="val">Siwan</span></div>
    <div class="row"><span class="lbl">State</span><span class="val">Bihar, India</span></div>
    <div class="row"><span class="lbl">Pin Code</span><span class="val" style="color:#60a5fa">841240</span></div>
    <div class="row"><span class="lbl">Coords</span><span class="val">26.12°N 84.35°E</span></div>
    <div class="row"><span class="lbl">Elevation</span><span class="val">~65 m</span></div>
    <div class="row"><span class="lbl">Data Source</span><span class="val" style="color:#10b981">OpenFreeMap</span></div>
</div>

<div class="btns">
    <button class="btn" onclick="map.zoomIn({duration:400})" title="Zoom In">＋</button>
    <button class="btn" onclick="map.zoomOut({duration:400})" title="Zoom Out">−</button>
    <button class="btn" onclick="resetView()" title="Reset">⌂</button>
    <button class="btn" id="rotBtn" onclick="toggleSpin()" title="Auto Rotate">↻</button>
    <button class="btn" onclick="flyTour()" title="Fly Tour">✈</button>
    <button class="btn" id="d3btn" onclick="toggle3D()" title="3D / 2D">◆</button>
</div>

<div id="map"></div>

<script>
/* ═══════════════════════════════════════════
   OPENFREEMAP — 100 % Free & Open Source
   No API key. No sign-up. Vector tiles.
   https://openfreemap.org
   ═══════════════════════════════════════════ */

const CENTER = [84.355, 26.122];          // Merahi, Siwan
const OFM = 'https://tiles.openfreemap.org/styles/';

const STYLE_MAP = {
    liberty:  OFM + 'liberty',
    bright:   OFM + 'bright',
    positron: OFM + 'positron',
    dark:     OFM + 'dark_matter'
};

let map, spinning = false, spinTimer, is3D = true;

// ── Init ──
map = new maplibregl.Map({
    container: 'map',
    style: STYLE_MAP.liberty,              // ← OpenFreeMap vector style
    center: CENTER,
    zoom: 15.2,
    pitch: 62,
    bearing: -25,
    antialias: true,
    maxPitch: 85
});

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-left');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 140, unit: 'metric' }), 'bottom-right');
map.addControl(new maplibregl.FullscreenControl(), 'top-left');

// ── On Load ──
map.on('load', () => {
    document.getElementById('loader').classList.add('hide');

    add3DBuildings();
    addMarkers();
    addBoundary();

    // cinematic entrance
    map.flyTo({ center: CENTER, zoom: 15.8, pitch: 68, bearing: 30, duration: 3500 });
});

map.on('mousemove', e => {
    document.getElementById('cLat').textContent = e.lngLat.lat.toFixed(4);
    document.getElementById('cLng').textContent = e.lngLat.lng.toFixed(4);
});

/* ── 3D BUILDINGS (the magic!) ── */
function add3DBuildings() {
    const layers = map.getStyle().layers;
    let labelLayerId;
    for (const l of layers) {
        if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
            labelLayerId = l.id;
            break;
        }
    }

    // Check if a building layer already exists in the style
    const hasBuilding = layers.some(l => l.id === 'building');

    if (hasBuilding) {
        // Extrude existing building layer
        try {
            map.setPaintProperty('building', 'fill-extrusion-color', [
                'interpolate', ['linear'], ['get', 'render_height'],
                0, '#e0e7ff',
                10, '#93c5fd',
                30, '#3b82f6',
                60, '#1e3a8a'
            ]);
            map.setPaintProperty('building', 'fill-extrusion-height', [
                'interpolate', ['linear'], ['zoom'],
                13, 0,
                15.5, ['coalesce', ['get', 'render_height'], 5]
            ]);
            map.setPaintProperty('building', 'fill-extrusion-opacity', 0.75);
        } catch(e) {
            // fallback: add new extrusion layer
            addExtrusionLayer(labelLayerId);
        }
    } else {
        addExtrusionLayer(labelLayerId);
    }
}

function addExtrusionLayer(beforeId) {
    // Add a source from OpenStreetMap via OpenFreeMap
    if (!map.getSource('osm-buildings')) {
        map.addSource('osm-buildings', {
            type: 'vector',
            url: 'https://tiles.openfreemap.org/planet'
        });
    }

    map.addLayer({
        id: '3d-buildings',
        source: 'osm-buildings',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 13,
        paint: {
            'fill-extrusion-color': [
                'interpolate', ['linear'], ['get', 'render_height'],
                0, '#c7d2fe',
                10, '#818cf8',
                30, '#4f46e5',
                60, '#1e1b4b'
            ],
            'fill-extrusion-height': [
                'interpolate', ['linear'], ['zoom'],
                13, 0,
                15, ['coalesce', ['get', 'render_height'], 6]
            ],
            'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
            'fill-extrusion-opacity': 0.72
        }
    }, beforeId);
}

/* ── MARKERS ── */
const POI = [
    { n:'📍 Merahi Village Center', d:'Heart of Merahi · PIN 841240', c:[84.355,26.122], t:'c' },
    { n:'🛕 Shiv Mandir', d:'Village temple & community place', c:[84.357,26.1235], t:'t' },
    { n:'🏫 Govt Primary School', d:'Government school, Merahi', c:[84.3528,26.1212], t:'s' },
    { n:'💧 Village Pokhar', d:'Traditional pond for irrigation', c:[84.3565,26.1198], t:'w' },
    { n:'🛣️ Siwan Road Junction', d:'Main road to Siwan town', c:[84.3515,26.1245], t:'r' },
    { n:'🏘️ Tola / Hamlet', d:'Residential cluster', c:[84.3585,26.1208], t:'v' },
    { n:'🌾 Khet (Fields)', d:'Paddy & wheat farmland', c:[84.3605,26.1188], t:'v' },
    { n:'🏥 Sub Health Center', d:'Primary healthcare nearby', c:[84.3505,26.1255], t:'s' }
];

function addMarkers() {
    POI.forEach(p => {
        const el = document.createElement('div');
        el.className = 'mk mk-' + p.t;
        const popup = new maplibregl.Popup({ offset:22, closeOnClick:false })
            .setHTML(`<div class="pt">${p.n}</div><div class="pd">${p.d}<br>📌 ${p.c[1].toFixed(4)}°N, ${p.c[0].toFixed(4)}°E</div>`);
        new maplibregl.Marker({ element:el, anchor:'bottom' })
            .setLngLat(p.c).setPopup(popup).addTo(map);
    });
}

/* ── BOUNDARY ── */
function addBoundary() {
    const pts = 72, r = 1.0, coords = [];
    for (let i = 0; i <= pts; i++) {
        const a = (i/pts)*2*Math.PI;
        const lat = CENTER[1] + (r*Math.sin(a))/110.574;
        const lng = CENTER[0] + (r*Math.cos(a))/(111.32*Math.cos(CENTER[1]*Math.PI/180));
        coords.push([lng, lat]);
    }
    map.addSource('bnd', { type:'geojson', data:{ type:'Feature', geometry:{ type:'Polygon', coordinates:[coords] } } });
    map.addLayer({ id:'bnd-fill', type:'fill', source:'bnd', paint:{ 'fill-color':'#3b82f6','fill-opacity':0.06 } });
    map.addLayer({ id:'bnd-line', type:'line', source:'bnd', paint:{ 'line-color':'#60a5fa','line-width':2,'line-dasharray':[4,3],'line-opacity':0.6 } });
}

/* ── CONTROLS ── */
function resetView() {
    map.flyTo({ center:CENTER, zoom:15.8, pitch:68, bearing:30, duration:2200 });
}

function toggleSpin() {
    spinning = !spinning;
    const b = document.getElementById('rotBtn');
    if (spinning) { b.classList.add('active'); spinTimer = setInterval(()=> map.setBearing(map.getBearing()+.35), 16); }
    else { b.classList.remove('active'); clearInterval(spinTimer); }
}

function flyTour() {
    const pts = [
        { center:CENTER, zoom:16.2, pitch:72, bearing:0 },
        { center:[84.359,26.124], zoom:15.6, pitch:65, bearing:90 },
        { center:[84.351,26.119], zoom:15.6, pitch:60, bearing:180 },
        { center:[84.357,26.118], zoom:15.8, pitch:70, bearing:270 },
        { center:CENTER, zoom:15.8, pitch:68, bearing:360 }
    ];
    let i = 0;
    (function go(){ if(i>=pts.length) return; map.flyTo({...pts[i], duration:3000}); i++; setTimeout(go,3300); })();
}

function toggle3D() {
    is3D = !is3D;
    map.easeTo({ pitch: is3D ? 68 : 0, duration:900 });
    document.getElementById('d3btn').classList.toggle('active', is3D);
}

/* ── STYLE SWITCHER ── */
document.querySelectorAll('.sbtn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.sbtn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        const c = map.getCenter(), z = map.getZoom(), p = map.getPitch(), b = map.getBearing();
        map.setStyle(STYLE_MAP[btn.dataset.s]);
        map.once('styledata', () => {
            map.jumpTo({ center:c, zoom:z, pitch:p, bearing:b });
            setTimeout(() => { try { add3DBuildings(); addBoundary(); } catch(e){} }, 600);
        });
    });
});
</script>
</body>
</html>
